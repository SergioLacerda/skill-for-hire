name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Examines the dependency delta of the PR (Go modules and workflow
      # actions). Findings already present on the base branch are not
      # re-reported; Dependabot and `make vuln` cover those.
      - name: Dependency review
        uses: actions/dependency-review-action@c74b580d73376b7750d3d2a50bfb8adc2c937507 # v3.1.5
        with:
          fail-on-severity: high
