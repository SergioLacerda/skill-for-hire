name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so a vulnerability published after merge is noticed without
    # waiting for the next change.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    # The same targets a developer runs locally: `make security`.
    # Also part of `make ci`, so the release `verify` job runs it; this
    # workflow adds the PR check and the weekly scan between releases.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secret scan covers every commit, not only the tip.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Vulnerability scan and secret scan
        run: make security
