name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

# Two tags pushed close together must not publish concurrently — they
# share dist/ semantics and the same GitHub Release API surface. Never
# cancel a release in flight; a half-published release is worse than a
# slow one.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Local CI gates on the tagged commit
        run: make ci

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write      # required for build-provenance OIDC token
      attestations: write  # required to publish the attestation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify no pre-existing release for this tag
        # A hand-created GitHub Release for this tag interferes with
        # goreleaser's own release-creation logic in ways that are hard
        # to diagnose after the fact.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for tag $TAG. Delete it (or the tag) before re-running." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        # The `before` hook in .goreleaser.yaml builds skillhire and packs
        # every skill into packs/, so the skills ship as release assets in
        # the same publish step as the CLI binaries.
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        # CycloneDX SBOM covers the module graph of the skillhire CLI at
        # this tag. Uploaded as a release asset so consumers can audit
        # the transitive dependency set without cloning.
        uses: anchore/sbom-action@v0
        with:
          artifact-name: skillhire-${{ github.ref_name }}-sbom.cdx.json
          output-file: skillhire-sbom.cdx.json
          format: cyclonedx-json
          upload-release-assets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (CLI binaries)
        # SLSA-style build provenance for what goreleaser published. The
        # checksum file already pairs each digest with its published
        # asset name (skillhire-<os>-<arch>), so the attested subject
        # matches what users actually download.
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest build provenance (skill packs)
        # Skill packs live outside dist/ (§ .goreleaser.yaml explanation)
        # and therefore aren't in SHA256SUMS. Attest them by path so the
        # tar.gz + .release.yaml pair also carries provenance.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packs/*.tar.gz
            packs/*.release.yaml
