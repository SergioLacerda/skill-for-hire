name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on feature branches; keep main in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny by default; each job opts into what it needs.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Local CI lint gates
        run: make ci-lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Local CI test gates
        run: make ci-test

      - name: Upload skill packs (dry-run artifact)
        # Publishing happens on tag; on push/PR we just make the packs
        # available for review as a workflow artifact. `make pack-skills`
        # writes to dist/ locally; goreleaser writes them to packs/ during
        # a full snapshot.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-packs-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.release.yaml
          if-no-files-found: error
          retention-days: 14

  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Snapshot release (no publish)
        run: make release-dry-run
