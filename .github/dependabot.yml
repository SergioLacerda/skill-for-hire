# Dependabot proposes updates; it never merges. Every PR runs the full CI
# and security gates before a human reviews it. Dependency Review
# (.github/workflows/dependency-review.yml) examines the resulting delta.
#
# Version-update PRs target `develop` (integration branch). This file is
# read from the repository's default branch, so it only takes effect once
# it is merged to `main`. Security updates ignore `target-branch` and are
# always raised against the default branch.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "go"]

  # Keeps the SHA pins in .github/workflows/*.yml current (version comment
  # on each pin is updated together with the SHA).
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]
