apiVersion: skillsforhire.dev/v1
kind: Skill

metadata:
  name: treasure-chest
  version: "0.2.0"
  displayName: Treasure Chest
  description: Mineração, curadoria, lifecycle e recuperação de conhecimento reutilizável.
  owner: skill-for-hire
  lifecycle: experimental
  tags:
    - knowledge
    - curation
    - runbooks
    - jewels

spec:
  entrypoint: SKILL.md

  compatibility:
    clients:
      - name: generic-agent-skills
        version: ">=1"

  capabilities:
    network:
      mode: denied
    filesystem:
      mode: workspace-read
    subprocess:
      mode: denied
    secrets:
      mode: denied
    destructiveActions:
      confirmation: required

  execution:
    timeoutSeconds: 120
    maxOutputBytes: 10485760
    installDependenciesAtRuntime: false

  dependencies:
    required: []
    optional:
      - name: atlas
        version: "^0.1"
        capability: architecture.map

  composition:
    provides:
      - knowledge.mine
      - knowledge.search
      - knowledge.curate
      - runbook.select
      - learning.reuse
    conflictsWith: []
    priority: 100

  quality:
    triggerEvals: tests/trigger/eval-queries.json
    behaviorTests: tests/behavior/cases.yaml

  distribution:
    licenseFile: ../../LICENSE
    changelog: CHANGELOG.md
    sourceRepository: https://github.com/sergiolacerda/skill-for-hire
    integrity:
      algorithm: sha256
