apiVersion: skillsforhire.dev/v1
kind: Skill

metadata:
  name: atlas
  version: "0.1.0"
  displayName: Atlas
  description: Cartografia estrutural e documental de projetos.
  owner: skill-for-hire
  lifecycle: experimental
  tags:
    - architecture
    - discovery
    - indexing
    - adr

spec:
  entrypoint: SKILL.md

  compatibility:
    clients:
      - name: generic-agent-skills
        version: ">=1"

  capabilities:
    network:
      mode: denied
    filesystem:
      mode: workspace-read
    subprocess:
      mode: denied
    secrets:
      mode: denied

  execution:
    timeoutSeconds: 120
    maxOutputBytes: 10485760
    installDependenciesAtRuntime: false

  dependencies:
    required: []
    optional: []

  composition:
    provides:
      - architecture.map
      - architecture.search
      - architecture.impact
      - adr.discover
      - adr.relate
    conflictsWith: []
    priority: 100

  quality:
    triggerEvals: tests/trigger/eval-queries.json
    behaviorTests: tests/behavior/cases.yaml

  distribution:
    licenseFile: ../../LICENSE
    changelog: CHANGELOG.md
    sourceRepository: https://github.com/sergiolacerda/skill-for-hire
    integrity:
      algorithm: sha256
